spring:
  application:
    name: quiz-forge-ai
  ai:
    openai:
      base-url: http://localhost:1234/v1
      chat:
        model: google/gemma-4-12b
        extra-body:
          reasoning_effort: none
      api-key: "local-llm-no-key-needed"
  datasource:
    url: jdbc:postgresql://localhost:5432/quizForge
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
