spring:
  ai:
    openai:
      chat:
        base-url: http://localhost:1234
        options:
          model: google/gemma-4-e2b
      api-key: "local-llm-no-key-needed"
  datasource:
    url: jdbc:h2:mem:quizforge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
